spring.application.name=payment-service-test
server.port=0

# DynamoDB & SQS Test Settings
dynamodb.table.payment=tb-payment-test
sqs.queue.os-ready-for-payment=os-ready-for-payment-queue-test
sqs.queue.payment-notification=payment-notification-queue-test
sqs.queue.payment-success=payment-success-queue-test
payment.sqs.health-check.enabled=false

# Resilience4j Circuit Breaker Test Settings
resilience4j.circuitbreaker.instances.mercadoPagoCircuitBreaker.sliding-window-size=2
resilience4j.circuitbreaker.instances.mercadoPagoCircuitBreaker.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.mercadoPagoCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.mercadoPagoCircuitBreaker.wait-duration-in-open-state=5000
resilience4j.circuitbreaker.instances.mercadoPagoCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true

# Mercado Pago Settings (Dynamic URL will be set by WireMock)
mercadopago.access-token=TEST-MOCK-TOKEN-MERCADOPAGO
mercadopago.base-url=http://localhost:8089

