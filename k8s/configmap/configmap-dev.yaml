apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: repairshop
  labels:
    app: payment-service
    env: dev
data:
  SPRING_APPLICATION_NAME: payment-service
  SERVER_PORT: "8082"
  SPRING_PROFILES_ACTIVE: dev
  AWS_REGION: us-east-1
  DYNAMODB_TABLE_PAYMENT: tb-payment-dev
  SQS_OS_READY_FOR_PAYMENT: os-ready-for-payment-queue-dev
  SQS_PAYMENT_NOTIFICATION: payment-notification-queue-dev
  SQS_PAYMENT_SUCCESS: payment-success-queue-dev
  SQS_HEALTH_CHECK_ENABLED: "true"
  SQS_HEALTH_CHECK_MAX_IDLE: "120"
  LOGGING_LEVEL_COM_CAO_REPAIRSHOP_PAYMENT: DEBUG
